name: Blindmate
description: >-
  Blindmate is a friend-based dating app that inverts the swipe model: instead of
  writing their own profile, a single person's friends answer questions about them,
  and matches are made through character-first "Blindchats" that surface compatibility
  before appearance. Founded in Germany and available on iOS and Android in German,
  English, and Spanish, the app reports over one million users and positions itself
  around trust, reduced harassment, data privacy, and green-energy infrastructure.
  Blindmate is a Speedinvest portfolio company; it is a consumer mobile product and
  publishes no public developer API, so this profile captures its web, security, and
  policy surface rather than API artifacts.
